# The trend lane's brand map (news247/trends.py): consumer brands -> the listed company whose
# revenue they move. Chris Camillo's rule: a real change in what people do, at a company small
# enough for it to matter, before the stock reflects it.
#
# weight (a rule anyone can check, not an estimated revenue share):
#   core  - the brand IS the company (Chipotle, Duolingo, Celsius)
#   major - one of the company's few headline brands (Burger King at Restaurant Brands)
# wiki:  English Wikipedia article titles (spaces as underscores); `news247 trends --check`
#        reports any title that doesn't resolve.
# apps:  words that identify the brand's app in the App Store charts (app name or developer).
#        Apps not listed here are still matched by developer name to the listed universe.
# terms: how news headlines name the brand (for alt-data and sell-out reports).
