  - name: Amazon and AWS (the early trade)
    ticker: AMZN
    period: Early in the cloud era (year not stated)
    noticed: >-
      Developers on Reddit and technology forums talking about migrating their companies' data
      to the cloud: "This AWS is going to be a big deal."
    trade: Bought Amazon for AWS.
    outcome: Amazon is among his biggest dollar winners (gain for this trade not stated).
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}

  - name: Amazon's Q2 2026 call (the $10 million day)
    ticker: AMZN
    period: Jul 30-31 2026
    noticed: >-
      After 100+ hours of research he was confident AWS would beat (he expected growth "north of
      25", against a whisper of about 25%). The real question was the call: having watched
      Microsoft get ahead of the capex question, he expected Andy Jassy to raise capex and say
      most of it can be pulled back if demand fails. He called that 99% likely and the whole
      trade 80/20, leaving room for events he couldn't foresee.
    trade: >-
      About $2 million of AMZN calls expiring the next day, funded by selling millions of dollars
      of other stock in a fully levered account, the day after seven figures of 24-hour options
      expired worthless. He says he knew it "should have been triple".
    outcome: >-
      About $10 million in a day, a few million more than his drawdown had cost him (self-reported).
      AWS revenue grew about 37% to $42.2B and 2026 capex was raised to about $220B, with Jassy
      saying Amazon still won't have enough capacity for 2026 demand.
    price_check: "AMZN $235.50 (Jul 30 2026) to $271.58 (Jul 31), +15.3%, its biggest one-day gain since 2012 (Bloomberg)."
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}
      - {label: "@ChrisCamillo on X (Jul 30 2026): \"Most gut-wrenching, highest-conviction, levered trade of my life… $AMZN\"", url: "https://x.com/ChrisCamillo/status/2082925083631272364"}
      - {label: "CNBC (Jul 30 2026): Amazon Q2 2026 results", url: "https://www.cnbc.com/2026/07/30/amazon-amzn-q2-earnings-report-2026.html"}

  - name: Bloom Energy and the forced sellers (2026)
    ticker: BE
    period: July 2026
    noticed: >-
      Back in Bloom (he bought at about $70, again above $100 and again above $300), he saw its
      fall as forced selling: Leopold Aschenbrenner's Situational Awareness fund held the same
      names and had to be getting margin called, while leveraged Korean accounts unwound the
      same stocks. "I knew it was going to revert. I just didn't have the timing."
    trade: >-
      Added Bloom and Amazon into the fall at about 1x leverage; seven figures of options
      expiring Wednesday Jul 29 went to zero.
    outcome: >-
      His account fell about 40% in a couple of weeks (self-reported), and he thinks he lost money on
      Bloom overall. The fund was reported margin called at about 4x gross leverage and sold its
      roughly $16B public book to Citadel on Jul 30.
    price_check: >-
      BE $295.05 (Jul 6 2026) to $163.75 (Jul 29), -44.5%, including -13.6% on Jul 16 when Kimi K3
      hit AI stocks; then +26.5% to $207.12 on Jul 30, the day the fund's book was sold.
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}
      - {label: "CNBC (Jul 31 2026): why Situational Awareness imploded", url: "https://www.cnbc.com/2026/07/31/why-leopold-aschenbrenner-situational-awareness-hedge-fund-imploded.html"}
      - {label: "Bloomberg (Jul 21 2026): Korean traders unwind leveraged bets", url: "https://www.bloomberg.com/news/articles/2026-07-21/korean-stock-traders-unwind-leveraged-bets-to-lowest-since-april"}

  - name: Sweetgreen's wraps, overtaken by an outbreak
    ticker: SG
    period: May-August 2026
    noticed: >-
      The wraps launched nationwide on May 6. His own check in North Texas found wraps about 15% of
      orders and half of them picked up, but it was "still way too soon to have conviction". A
      visit to Cava then suggested Cava suits the mass market, where Sweetgreen suits clean
      eaters.
    trade: A "very tiny" speculative position, research only partly done.
    outcome: >-
      A record cyclospora outbreak, traced to iceberg lettuce Sweetgreen says it doesn't use,
      scared people off salads. Sweetgreen cut its outlook on Aug 6 (fear took about 600 basis
      points off July comps), and he called his wrap thesis "completely irrelevant" until the
      outbreak passed: "the only Sweetgreen trade right now is to what extent will this virus
      destroy their sales more or less than the market thinks."
    price_check: >-
      SG $6.87 at the launch (May 6) to $10.21 (May 28), then $5.40 after the outlook cut (Aug 7).
      As the outbreak ended it recovered to $9.63 (Oct 9 2026).
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}
      - {label: "@ChrisCamillo on X (Jun 1 2026): wrap channel check", url: "https://x.com/ChrisCamillo/status/2061540915886367048"}
      - {label: "CNBC (Aug 6 2026): Sweetgreen cuts outlook on cyclospora fears", url: "https://www.cnbc.com/2026/08/06/sweetgreen-cuts-full-year-outlook-as-cyclospora-fears-weigh-on-sales.html"}

# His theses in the Aug 9 2026 interview. These are his views as dated, not this desk's calls; the
# "since" lines are this desk's own price check (TradingView closes, Aug 7 2026 -> Oct 9 2026;
# SPY +0.7% over the same span).
views:
  as_of: "2026-08-09"
  source: {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}
  items:
    - thesis: The Amazon trade isn't over
      ticker: AMZN
      quote: Amazon trade is not over. In many ways, it's just beginning.
      detail: >-
        A multi-year trade on AWS and on 25 years of logistics and distribution, traded around
        the moments the stock is likely to jump. He said he was no longer heavily levered in it.
      since: AMZN $274.48 to $262.43, -4.4%.
    - thesis: Still heavily in Bloom Energy
      ticker: BE
      quote: Mainly Bloom and Amazon. Yes.
      detail: Still invested and levered in AI names after the July drawdown.
      since: BE $219.34 to $280.50, +27.9%.
    - thesis: Distribution moats win when intelligence is free
      ticker: ""
      quote: Those that have distribution will win.
      detail: >-
        The coffee-cup theory: once every company can get the best design from AI, the winner
        is the one that already makes and ships billions of cups. He is looking for companies with
        massive distribution, often boring ones, that will get cheaper and better to run.
      since: ""
    - thesis: The AI efficiency wave reaching the income statement
      ticker: BKNG
      quote: If we start to see that wording starting to come out more and more in earnings reports… watch out.
      detail: >-
        Booking.com reported AI tools cutting its customer-service costs. Its CFO has said
        gen-AI cut service cost per reservation by about 10% while bookings rose about 10% (Feb 2026),
        and in August that cost per booking keeps falling at a double-digit rate. The desk tracks
        that wording as the "Companies cutting costs with AI" narrative.
      since: BKNG $214.42 to $160.34, -25.2%.
    - thesis: Another AI fear cycle is coming
      ticker: ""
      quote: What will the narratives be like that people use to try to crash the AI sector in 30 to 90 days?
      detail: >-
        He expected the next 30-60 days to show "the realness of AI" and another fear cycle after
        it, so he is measuring narrative acceleration and following who drove the last one. The
        desk's attention trade does the measuring.
      since: ""
    - thesis: The AI labs are too big to fail
      ticker: ""
      quote: Do you really think that our government is going to let OpenAI and Anthropic fail?
      detail: >-
        If OpenAI or Anthropic couldn't pay for their compute, he expects a government-brokered
        rescue that moves the contracts to stronger hands, so compute keeps its value.
      since: ""
    - thesis: No SpaceX at $1.6 trillion
      ticker: SPCX
      quote: Whatever people are seeing in SpaceX is something more than I'm able to see.
      detail: >-
        He invested privately at $30 billion and won't buy the public stock "unless something
        radically changes": the price assumes best cases years away.
      since: SPCX $133.11 to $162.57, +22.1%.
    - thesis: The Sweetgreen wrap thesis is on hold
      ticker: SG
      quote: My thesis on the wrap has become irrelevant until this virus passes.
      detail: The only question left was whether the outbreak hurt sales more or less than the market expected.
      since: SG $5.40 to $9.63, +78.3%.

# The attention trade (camillo.py: Narrative, attention_trade, NarrativeWatch). Each narrative is
# a set of words; a headline or post belongs to it when it says one of `any` (and, when given,
# one of `with`). A trailing * is a stem. `hits` is this desk's list of the listed names each
# narrative moves most: the ones Camillo named in the interview (Bloom Energy, Nebius, Amazon) plus the AI
# infrastructure leaders. Built from his account of July 2026: Kimi's open model, AI capex
# doubts, worry that OpenAI and Anthropic can't pay for compute, and forced selling.
narratives:
  - id: open_models
    name: Cheap open models make compute less needed
    side: fear
    sector: AI
    any: [kimi k2, kimi k3, kimi k4, kimi model, moonshot ai, deepseek, qwen, open-source model, open-source models, open source model, open source models, open-weight, open-weights, open weights, chinese ai model, chinese ai models, chinese open model, chinese open models]
    hits: [NVDA, AVGO, BE, NBIS, AMZN]
    note: >-
      Kimi K3 (Jul 16 2026) sent chip stocks into a bear market and Bloom Energy down 13.6% in a
      day. His miss: he knew it was coming but under-weighted how fast the narrative spread.
  - id: capex_doubt
    name: AI spending won't pay back
    side: fear
    sector: AI
    any: [ai bubble, bubble, capex, capital spending, ai spending, data center spending, data-center spending, overbuild*, circular deal*, circular financing, dot-com]
    with: [ai, a.i., artificial intelligence, data center, data centers, hyperscaler*, nvidia, compute]
    hits: [NVDA, AVGO, BE, NBIS, AMZN, ORCL]
    note: >-
      The capex panic he says ran all of 2026: investors marking down companies for spending
      cash on contracted demand.
  - id: lab_credit
    name: AI labs can't pay for their compute
    side: fear
    sector: AI
    any: [openai, anthropic, xai, ai lab, ai labs]
    with: [cash burn, burn rate, burning cash, losses, debt, default*, bailout, backstop, insolven*, funding gap, can't pay, cannot pay, too big to fail, contract risk]
    hits: [ORCL, CRWV, NBIS, IREN, AMZN, MSFT]
    note: >-
      His answer to it: the government would broker a rescue and the compute contracts would
      move to stronger hands.
  - id: forced_selling
    name: Leverage unwinding
    side: fear
    sector: AI
    any: [margin call, margin calls, deleverag*, forced selling, forced seller*, forced liquidation*, liquidation*, de-grossing, degrossing, unwind*]
    with: [fund, funds, hedge fund*, investors, traders, retail, stocks, shares, ai, korea*, leverage*, etf, etfs, margin]
    hits: [BE, NBIS, NVDA, CRWV]
    note: >-
      Forced selling isn't information, and it ends; the July 2026 unwind at Situational Awareness and
      in Korea reversed the day the fund's book was sold.
  - id: ai_efficiency
    name: Companies cutting costs with AI
    side: hope
    sector: AI
    any: [ai, a.i., artificial intelligence, generative ai, gen ai, genai, ai agents, ai tools, chatbot*]
    with: [cost savings, saves, saving, lower costs, lowering costs, cut costs, cutting costs, cost cuts, costs down, customer service costs, customer-service costs, cost per, efficiency, efficiencies, productivity, headcount, fewer employees, margin expansion, layoff*, job cuts, cuts jobs, cut jobs, jobs cut, workforce]
    hits: [AMZN, BKNG]
    note: >-
      His "last leg" of the AI cycle: when earnings reports start saying AI is lowering costs, "you're
      going to see AI blow up unlike we've ever seen it before."
