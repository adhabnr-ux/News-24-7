# The Camillo desk's playbook (camillo.py, the Camillo tab in the app, docs/CAMILLO.md).
#
# Every statement here carries its source. Quotes are as the sources print them; where a source
# is a summary of a book rather than the book (Laughing at Wall Street, Unknown Market Wizards),
# the label says so. Nothing is filled in from folklore: claims we could not source are listed
# under `unverified` and never shown as fact.

intro: >-
  Chris Camillo trades "when there's an imbalance of information": he spots a change in what
  people do before Wall Street does, ties it to the listed company it moves, and gets out when the
  market knows what he knows. This desk runs that method as rules over the trend lane and shows
  every idea against it.

principles:
  - title: Social arbitrage
    text: >-
      The edge is information that is already public in culture and conversation but not yet in
      the market's view of a company. He calls it social (or information) arbitrage: neither
      fundamental nor technical analysis.
    quote: I like to think of it as investing when there's an imbalance of information.
    sources:
      - {label: "Opto Sessions / CMC Markets interview (2020)", url: "https://www.cmcmarkets.com/en/optox/how-chris-camillo-invests-in-the-imbalance-of-information"}
      - {label: "Jack Schwager, Unknown Market Wizards (2020), chapter \"Neither\"", url: "https://seekingalpha.com/article/4395212-unknown-market-wizards-jack-schwager-joins-alpha-trader-podcast-transcript"}

  - title: Detect change before others
    text: >-
      The method relies on noticing change first: a product selling out, a habit spreading, a
      brand losing its crowd, conversation about a topic accelerating. It starts as unstructured
      conversation on social channels before it reaches financial media.
    quote: I'm a social arb trader… I essentially try and detect change early in the world.
    sources:
      - {label: "Benzinga interview (June 2023)", url: "https://www.benzinga.com/top-stories/23/06/32897513/exclusive-chris-camillo-on-connecting-the-dots-from-social-change-to-investment-opportunities"}
      - {label: "Opto Sessions / CMC Markets (2020): \"an acceleration in conversation… or if a product is selling out\"", url: "https://www.cmcmarkets.com/en/optox/how-chris-camillo-invests-in-the-imbalance-of-information"}

  - title: Tags, not tickers
    text: >-
      His company TickerTags mapped words and phrases (products, brands, habits) to the tickers
      they affect and tracked how often people said them; he described a taxonomy of 350,000
      tags. M Science (Jefferies' research arm) bought it in June 2018.
    sources:
      - {label: "The Successful Pitch, ep. TSP027 (transcript)", url: "https://johnlivesay.com/chris-camillo-transcription/"}
      - {label: "Business Wire, June 1 2018: M Science acquires TickerTags", url: "https://www.businesswire.com/news/home/20180601005203/en/M-Science-Acquires-Leading-Data-Mapping-Company-TickerTags"}

  - title: It has to matter to the company
    text: >-
      The question is whether the information will have a real impact on a publicly traded
      company, and smaller companies feel it more. He names no fixed revenue share: his slime
      trade was on Newell Brands, where slime glue was a sliver of revenue, but the product line
      itself jumped about 50%.
    sources:
      - {label: "Laughing at Wall Street excerpt, US News (Nov 1 2011)", url: "https://money.usnews.com/money/personal-finance/mutual-funds/articles/2011/11/01/how-one-amateur-investor-spots-stocks-before-wall-street"}
      - {label: "Opto Sessions / CMC Markets (2020)", url: "https://www.cmcmarkets.com/en/optox/how-chris-camillo-invests-in-the-imbalance-of-information"}

  - title: Exit at information parity, win or lose
    text: >-
      He enters on an imbalance and leaves when the market at large agrees with him, whether the
      trade made or lost money. No price targets. In March 2024 he trimmed Celsius because "the
      world's finally caught on."
    quote: I invest when there's an information imbalance, and I exit the investment when we reach information parity.
    sources:
      - {label: "Stansberry Investor Hour ep. 192 (Feb 4 2021)", url: "https://stansberryresearch.com/stansberry-investor-hour/episode-192-turning-20k-to-2-million-during-the-financial-crisis"}
      - {label: "24/7 Wall St. (May 29 2026): \"I don't trade price, and I don't have price targets\"", url: "https://247wallst.com/investing/2026/05/29/investor-goes-70-into-amazon-with-leveraged-options-calls-amazon-ultimate-beneficiary-of-ai/"}
      - {label: "@ChrisCamillo on X (Mar 2024): trimmed CELH", url: "https://x.com/ChrisCamillo/status/1763618585572716715"}

  - title: Only the high-conviction ideas
    text: >-
      He estimated that 99% of his ideas never become trades. Looking back, he would have spent
      less time on low-conviction trades; Schwager's lesson from the chapter is the same, noting
      the best ideas may come only every couple of months.
    quote: If I could go back in time I would spend less time on low conviction trades.
    sources:
      - {label: "Benzinga (June 2019)", url: "https://www.benzinga.com/general/psychology/19/06/13922843/chris-camillo-talks-trading-strategies-advice-and-more-ahead-of-trading-summit"}
      - {label: "Benzinga (Mar 2014): Nintendo and LeapFrog", url: "https://www.benzinga.com/trading-ideas/long-ideas/14/03/4355310/how-one-investor-profited-from-leapfrog-and-nintendo-before-w"}
      - {label: "Unknown Market Wizards chapter lessons (summary)", url: "https://www.elearnmarkets.com/school/units/unknown-market-wizards#chris-camillo-neither"}

  - title: Hold your own view
    text: >-
      His most regretted trade was Under Armour: shaken by a related company's weak results and
      other people's opinions, he sold about two-thirds of a call position at a loss, and the
      company's earnings then proved his original read right.
    sources:
      - {label: "Unknown Market Wizards, Camillo chapter (summary)", url: "https://www.elearnmarkets.com/school/units/unknown-market-wizards#chris-camillo-neither"}

  - title: Earn the right to size up
    text: >-
      He trades concentrated, often with options, in his own money. His advice to anyone starting
      is the opposite: keep most money in a low-cost index fund and experiment with small amounts
      until a strategy has proven it delivers.
    quote: >-
      Do not trade aggressively or with conviction until you are able to identify a trading
      strategy that consistently delivers alpha. Until that happens, be content experimenting
      with small dollars.
    sources:
      - {label: "Benzinga (June 2019)", url: "https://www.benzinga.com/general/psychology/19/06/13922843/chris-camillo-talks-trading-strategies-advice-and-more-ahead-of-trading-summit"}
      - {label: "Stansberry Investor Hour ep. 192 (2021): \"I was always an options investor\"", url: "https://stansberryresearch.com/stansberry-investor-hour/episode-192-turning-20k-to-2-million-during-the-financial-crisis"}

  - title: Ground truth, not noise
    text: >-
      First find the one thing that will drive the stock (for Amazon in 2026: is all that capex
      turning into returns?), then leave finance to find out whether it is true. He reads the people
      doing the work (developers and employees on Reddit, X and technology forums, often with
      almost no followers) instead of other investors' opinions. His early Amazon trade began
      with developers on Reddit and technology forums talking about moving their companies'
      data to the cloud.
    quote: If you can figure out the ground truth in anything and place a bet on it, you're going to win.
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}

  - title: Study the other side more than your own
    text: >-
      Real conviction needs the bear case heard out: once you know why people disagree, you can
      judge whether they are right. In 2026 he spent more time on why investors were short the
      hyperscalers and Amazon than on his own thesis.
    quote: I will always spend more time trying to understand the other side of my trades than I do my own thesis.
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}

  - title: Never marry a stock
    text: >-
      When evidence goes against the thesis he exits at once, and sometimes takes the other
      side. His Sweetgreen thesis (the new wraps) "became irrelevant" when a lettuce outbreak
      became the only thing driving the stock.
    quote: If I see something that goes against my thesis, I will immediately exit my trade and sometimes take the opposite side of that trade.
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}

  - title: Everything is a probability game
    text: >-
      He runs every scenario he can think of, good and bad, and weighs each on research, leaving
      room for "things that I know I don't know" and "things that I don't know that I don't
      know". He put his Amazon earnings trade at 80/20: about 99% sure of his work, with the
      rest for outside events (Iran, a rumor overnight, someone moving the market).
    quote: I make an assessment on how likely each scenario is to play out based on actual research.
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}

  - title: The attention trade
    text: >-
      Narratives move prices before the truth does, and in a levered market they move them
      fast. He measures how quickly a narrative is accelerating and who is spreading it, to get
      ahead of the next AI fear cycle. His own lesson from July 2026: he knew the Kimi model was
      coming but under-weighted how fast that narrative was spreading.
    quote: I'm really paying attention more so than ever to the attention trade, meaning like where people have their attention, even if the information is not truthful.
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}

  - title: Small when unsure
    text: >-
      For a low- or medium-conviction idea, or just the urge to be in the game, he trades about
      2-3% of a high-conviction size: "90 to 95% of the emotional" benefit at a sliver of the
      risk. At an exit he can't decide on: "if you're at odds, just sell half."
    quote: When you have a low to medium conviction trade… just do it with a much, much smaller amount of money.
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}

  - title: Know where the leverage is
    text: >-
      Forced selling isn't information. In July 2026 he read Bloom Energy's fall as margin calls at
      Leopold Aschenbrenner's fund plus leveraged Korean accounts unwinding, so he expected it to
      revert once the liquidation ended; he had the direction right and the timing wrong.
      Leverage he knows about is something to plan for, not fear; the danger is leverage
      combined with influential people moving the market.
    quote: I'm not afraid of anything that I know exists. I just have to account for it in my thesis.
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}

process:
  - step: Detect the change
    text: Something people are doing differently, seen early in observation or conversation.
    how: >-
      Wikipedia attention (daily), Bluesky chatter counted by brand tags (hourly sample, the
      TickerTags idea), App Store climbs (6-hourly), sell-outs and waitlists, and tracker numbers
      in the news.
  - step: Map it to the company
    text: Work out which listed company the change actually flows to.
    how: >-
      A brand map of about 50 consumer brands to their owners, plus app developers matched to
      listed company names.
  - step: Validate it
    text: >-
      Test the observation before believing it. His book's Coach example: long store lines turned
      out to be shoppers trading down, not strength.
    how: >-
      An idea is only pushed when two independent kinds of evidence agree on a direction; the
      direction is read from the numbers (visits up 7%, traffic down double digits).
  - step: Hear the other side
    text: >-
      Spend more time on why others disagree than on your own thesis; that is where real
      conviction comes from.
    how: >-
      Each idea lists the headlines arguing against it (gloom for a long, hype for a short), one
      per source, and fails a test if an outbreak, recall, lawsuit, executive exit or guidance
      cut has hit the brand since the evidence began.
  - step: Check it matters
    text: The change must be big enough to move the company's results.
    how: >-
      Our rule, not his: a company up to $150B when the brand is the company, $60B for one of a
      few headline brands, $20B when matched by name only.
  - step: Confirm the imbalance
    text: >-
      Wall Street must not know yet. His book's consensus score: bullish quotes over bearish
      quotes from journalists and analysts; above 2 is parity.
    how: >-
      The consensus score over every headline this system read in 30 days naming the brand, one
      per source; plus the price check (out if the stock already moved 15% the trend's way).
  - step: Find the catalyst
    text: The moment the market learns it, usually the company's next report.
    how: The next report date from Nasdaq's earnings calendar, on every idea.
  - step: Size by conviction
    text: >-
      Few trades, only the high-conviction ones; anything less at 2-3% of that size, or not at
      all.
    how: >-
      HIGH ideas (two kinds agree, every filter passed) are pushed; MEDIUM ones wait in the app;
      LOW ones stay on the board. Each idea is labeled high or low conviction with his size rule.
      The desk never sizes or places a trade.
  - step: Watch the narrative
    text: >-
      Know where the market's attention is and how fast it is moving, true or not; a fast
      narrative in a levered market can swamp the ground truth for a while.
    how: >-
      The attention trade: every narrative below is measured as a share of all the headlines this
      system reads (and of Bluesky posts), the last 3 days against the 14 before. One alert when
      a narrative starts accelerating; a pushed alert when two fear narratives in one sector
      accelerate together.
  - step: Exit at parity
    text: >-
      Out when the market agrees, win or lose; no price target. Out at once if the thesis
      breaks. Unsure? Sell half.
    how: >-
      Each idea shows its exit: the consensus score passing 2, the report, the evidence stopping,
      or a shock breaking the thesis. Every idea is scored against the S&P 500 at 30, 60 and 90
      days.

avoid:
  - text: Low-conviction trades, the ones he says he'd skip if he could do it again.
    sources: [{label: "Benzinga (June 2019)", url: "https://www.benzinga.com/general/psychology/19/06/13922843/chris-camillo-talks-trading-strategies-advice-and-more-ahead-of-trading-summit"}]
  - text: Letting other people's opinions shake you out of a thesis the evidence still supports (Under Armour).
    sources: [{label: "Unknown Market Wizards (summary)", url: "https://www.elearnmarkets.com/school/units/unknown-market-wizards#chris-camillo-neither"}]
  - text: Trading on price or holding past parity.
    sources: [{label: "24/7 Wall St. (May 2026)", url: "https://247wallst.com/investing/2026/05/29/investor-goes-70-into-amazon-with-leveraged-options-calls-amazon-ultimate-beneficiary-of-ai/"}]
  - text: >-
      Betting on one brand's trend when the company is several brands. A high-conviction options
      bet on Restaurant Brands into earnings went wrong on a weak Tim Hortons quarter; he says he
      missed warning signs at a franchisee meeting.
    sources: [{label: "VladTV interview (2026, segment description)", url: "https://www.vladtv.com/article/315597/"}]
  - text: Trading big before the strategy has proven itself.
    sources: [{label: "Benzinga (June 2019)", url: "https://www.benzinga.com/general/psychology/19/06/13922843/chris-camillo-talks-trading-strategies-advice-and-more-ahead-of-trading-summit"}]

  - text: >-
      Loyalty to a stock. "The companies don't care about you. The stocks don't care about you."
      When the information changes, re-evaluate everything.
    sources: [{label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}]
  - text: >-
      Copying someone else's trade. Without your own conviction you can't make the right
      decisions when it goes wrong; take the idea, then do your own work and poke holes in it.
    sources: [{label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}]
  - text: >-
      The trade after a big win. "My worst investments are never made after I've lost money.
      They're always made after a great well-researched investment," chasing the next emotional
      hit.
    sources: [{label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}]
  - text: >-
      Paying for what others see that he doesn't. He passed on SpaceX at about $1.6 trillion ("I
      only invest in companies when I see something that others don't"), having invested
      privately at $30 billion.
    sources: [{label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}]
  - text: >-
      Illiquid money when the world is changing fast. He says his 160 private investments
      returned about 10-12% in aggregate against 60-70% a year in his public account, and he
      stopped investing privately as AI emerged to keep his capital movable.
    sources: [{label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}]

record:
  - claim: Brokerage statements from August 2006 audited for Unknown Market Wizards; 77% average annual compounded return 2006-2020 (S&P about 7.6%).
    sources: [{label: "Benzinga (Feb 2025), citing Schwager", url: "https://www.benzinga.com/news/25/02/43903377/chris-camillo-made-42-million-trading-stocks-over-15-years-heres-his-success-strategy"}]
  - claim: $20,000 in early 2007 to just over $2 million in three years.
    sources: [{label: "Laughing at Wall Street (St. Martin's, 2011)", url: "https://us.macmillan.com/books/9781250015754/laughingatwallstreet/"}]
  - claim: >-
      About $80 million generated in returns from that $20,000 start, before taxes, over 70-80
      trades in 17 years; self-reported (no audit found after 2021).
    sources:
      - {label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}
      - {label: "My First Million (2026, summary)", url: "https://finance.biggo.com/podcast/d7d0aa5d1619e25f"}
  - claim: >-
      About 60-70% a year on average in his public account over 17 years, against about 10-12%
      in aggregate on 160 private investments; self-reported.
    sources: [{label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}]
  - claim: >-
      His biggest dollar winners: Amazon, Nvidia, Palantir and Robinhood, each after 50-100
      hours of research. About 60% of his biggest trades in the last 10 years started as an idea
      from someone in his network (a DM, a text, a comment); self-reported.
    sources: [{label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}]
  - claim: >-
      Risk framing for his trading account, in his words: "ultra high risk, ultra high reward",
      concentrated and levered on high-conviction calls, sized so that it would take about six
      high-conviction losses in a row to wipe it out ("I've never made more than like two bad
      calls in a row"). He keeps it separate from money he lives on.
    sources: [{label: "Iced Coffee Hour, \"EMERGENCY UPLOAD\" with Chris Camillo (Aug 9 2026)", url: "https://www.youtube.com/watch?v=ahQlC54rqhk"}]

limits:
  - >-
    He reads TikTok, Instagram and X; none has a free API, so this desk reads Bluesky (smaller,
    and its users differ), Wikipedia and the App Store as stand-ins. Trends that live only on
    TikTok reach it later, through press coverage and attention.
  - >-
    It can't do his store checks, channel checks or franchisee conversations; his Restaurant
    Brands loss came from exactly that kind of missed signal.
  - >-
    The size limits for "it matters" are this desk's rule; he names no fixed revenue share.
  - >-
    The consensus score follows his book as readers have summarized it (not checked against the
    text), and it counts headlines this system read rather than analysts' quotes.
  - >-
    It never trades and never sizes positions. Ideas are leads to research; the track record below
    shows how they did against the S&P 500.

unverified:
  - '"Never use stop losses": appears only on quote-compilation sites, no source found.'
  - Specific option tenors and strikes (beyond "weekly" NVDA options and "leveraged" AMZN options).
  - The e.l.f. Cosmetics origin story and a Victoria's Secret short / Aerie long: secondary blogs only.
  - The exact consensus-score thresholds: one 2012 reader summary of the book.
  - >-
    "Citadel made two to two and a half billion dollars" on the Situational Awareness unwind
    (his estimate in the Aug 2026 interview): no source reports a dollar figure. What is reported:
    Citadel bought the fund's roughly $16B public book on Jul 30 2026, and its flagship fund had
    its best month since 2022 (CNBC, Aug 5 2026).
  - >-
    His Aug 2026 account figures (a 40% drawdown, about $10M made in one day) are self-reported.
    The stock moves they rest on are confirmed (see the cases).

cases:
  # Only trades a source describes. "Price check" lines are this desk's own reading of the
  # stock's daily bars (TradingView, split-adjusted), not his profit.
  - name: Snapple (his first trade)
    ticker: Snapple (acquired 1994)
    period: As a teenager; year not stated
    noticed: His favorite flavor was missing at 7-Eleven; the clerk said new iced-tea brands had squeezed Snapple's shelf space.
    trade: Bought put options, with his stockbroker brother's help.
    outcome: The next report showed inventories piling up; he says he tripled about $300 within days ("tripling his money in seven days," per the book's description).
    sources:
      - {label: "Tradestreaming Radio / Tearsheet interview (~2011)", url: "https://tearsheet.co/podcasts/how-to-beat-wall-street-by-using-facebook-reading-tabloids-and-shopping-with-chris-camillo/"}
      - {label: "Laughing at Wall Street, publisher description", url: "https://us.macmillan.com/books/9781429989664/laughingatwallstreet/"}

  - name: Nintendo and the Wii
    ticker: Nintendo ADR (NTDOY)
    period: E3 2006, held about a year
    noticed: At E3 the crowds lined up for the Wii's motion controller while Wall Street watched Microsoft and Sony.
    trade: Moved his whole portfolio into the Nintendo ADR.
    outcome: Held it about a year (gain not stated in the source).
    sources:
      - {label: "Benzinga (Mar 2014)", url: "https://www.benzinga.com/trading-ideas/long-ideas/14/03/4355310/how-one-investor-profited-from-leapfrog-and-nintendo-before-w"}

  - name: J.Crew and Michelle Obama
    ticker: J.Crew Group (taken private 2011)
    period: 2008-09
    noticed: Michelle Obama wearing and praising J.Crew in public.
    trade: Bought the stock (instrument not stated).
    outcome: Up 186%; "Wall Street caught up four months later."
    sources:
      - {label: "Laughing at Wall Street, publisher description", url: "https://us.macmillan.com/books/9781429989664/laughingatwallstreet/"}

  - name: LeapFrog's LeapPad
    ticker: LeapFrog (acquired 2016)
    period: Christmas 2011, stock around $3
    noticed: The LeapPad was the toy parents and "mommy bloggers" were hunting for, weeks before the financial press noticed.
    trade: Long (instrument not stated).
    outcome: The financial press picked the story up weeks after the parents did; gain not stated.
    sources:
      - {label: "Benzinga (Mar 2014)", url: "https://www.benzinga.com/trading-ideas/long-ideas/14/03/4355310/how-one-investor-profited-from-leapfrog-and-nintendo-before-w"}

  - name: The slime craze and Newell Brands
    ticker: NWL
    period: About 2016-17 (not stated)
    noticed: Kids making slime were emptying stores of Elmer's glue. "The whole world could have seen this," but few tied it to a stock. Elmer's belongs to Newell Brands.
    trade: Long Newell. Slime glue was a sliver of Newell's revenue, but that product line jumped about 50%.
    outcome: Not stated by him in the sources found (a secondary blog says about 200% on a leveraged trade).
    price_check: "Context only: Newell's Q1 2017 report, which the press tied to Elmer's, moved NWL from $46.39 (May 5 2017) to $51.93 (May 8), +11.9%."
    sources:
      - {label: "Opto Sessions / CMC Markets (2020)", url: "https://www.cmcmarkets.com/en/optox/how-chris-camillo-invests-in-the-imbalance-of-information"}

  - name: Netflix and Stranger Things
    ticker: NFLX
    period: Stranger Things season 1 (date not stated in the source)
    noticed: His team's social-data report showed the conversation around Stranger Things pointing to a strong quarter.
    trade: Long into the report.
    outcome: The stock rose about 20% on the earnings.
    price_check: "Our inference of the date: the first report after season 1 (Oct 17 2016) took NFLX from $9.98 to $11.88 the next day, +19.0% (split-adjusted)."
    sources:
      - {label: "Opto Sessions / CMC Markets (2020)", url: "https://www.cmcmarkets.com/en/optox/how-chris-camillo-invests-in-the-imbalance-of-information"}

  - name: Bikes in the lockdown (Dorel Industries)
    ticker: TSX:DII.B (Schwinn, Cannondale)
    period: April 2020 to late 2020
    noticed: Lockdown chatter about biking, bike shortages and rising searches.
    trade: Long Dorel around $1.56.
    outcome: Reported as sold around $11, about +629% (sources mix US and Canadian dollars).
    price_check: "TSX: C$1.56 on Apr 7 2020 to C$14.53 on Nov 30 2020, about 9.3x."
    sources:
