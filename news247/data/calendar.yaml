# Scheduled catalysts shown in Foretape's Calendar and Brief. Times are US/Eastern.
# Monthly option expirations (3rd Friday; quarterly "quad witching" in Mar/Jun/Sep/Dec) and the
# NYSE session are generated, so only one-off dates live here.
#
# impact: 3 = moves the whole market, 2 = moves a sector, 1 = worth knowing.
# Add your own (earnings dates, investor days) under the same keys; `note` is optional.

