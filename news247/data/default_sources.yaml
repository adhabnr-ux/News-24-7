- {name: gnews-market-movers, type: rss, url: "https://news.google.com/rss/search?q=%22stocks+fall%22+OR+%22shares+plunge%22+OR+%22stocks+tumble%22+OR+%22shares+soar%22+when:1h&hl=en-US&gl=US&ceid=US:en", tier: media, interval: 90}

# ------------------------------------------------------------------ Social / real-time
- {name: hackernews, type: hackernews, tags: front_page, interval: 30}
- name: bluesky
  type: bluesky
  tier: media
  # Official and newsroom accounts that exist on Bluesky; unresolvable handles are skipped.
  accounts: [apnews.com, reuters.com, nytimes.com, wsj.com, bloomberg.com, cnbc.com, washingtonpost.com, theverge.com, techcrunch.com, axios.com, politico.com, ft.com]
- name: x-stream
  # Real-time X feed (official filtered stream, pay-per-use ~$0.005/post). Set X_BEARER_TOKEN
  # and X_STREAM_ENABLED=true in .env. VIP accounts are texted instantly whatever they say;
  # squawk accounts relay newspaper scoops within seconds and are scored normally.
  type: x_stream
  enabled: ${X_STREAM_ENABLED:-false}
  bearer_token: "${X_BEARER_TOKEN:-}"
  vip_accounts: [OpenAI, OpenAINewsroom, sama, OpenAIDevs, ChatGPTapp, AnthropicAI, claudeai, GoogleDeepMind, sundarpichai, xai, AIatMeta, nvidia, satyanadella]
  accounts: [DeItaone, FirstSquawk, financialjuice, LiveSquawk, unusual_whales, zerohedge, WSJmarkets, business, Reuters, CNBCnow, FT, theinformation, elonmusk, WhiteHouse]
  vip_floor: high
- name: alpaca-news
  # Benzinga newsdesk pushed over a websocket; free Alpaca paper-trading keys work.
  type: alpaca_news
  enabled: ${ALPACA_ENABLED:-false}
  key: "${ALPACA_KEY:-}"
  secret: "${ALPACA_SECRET:-}"
  boost: 5
- name: x
  type: x
  enabled: false        # older polling alternative to x-stream (recent-search endpoint)
  bearer_token: "${X_BEARER_TOKEN:-}"
  tier: primary
  interval: 20
  accounts: [OpenAI, sama, AnthropicAI, GoogleDeepMind, xai, elonmusk, nvidia, Microsoft, satyanadella, tim_cook, WhiteHouse, federalreserve, DeItaone, FirstSquawk, unusual_whales, Reuters, business, WSJmarkets, CNBCnow]
- name: reddit
  type: reddit
  enabled: false        # needs a free Reddit "script" app
  client_id: "${REDDIT_CLIENT_ID:-}"
  client_secret: "${REDDIT_CLIENT_SECRET:-}"
  subreddits: [wallstreetbets, stocks, investing, StockMarket]
  min_score: 0
- name: finnhub-news
  type: finnhub_news
  enabled: false        # free key at finnhub.io
  token: "${FINNHUB_TOKEN:-}"
  category: general
