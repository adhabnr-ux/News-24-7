# Historical market-moving events, used by `news247 backtest` to measure the importance
# criteria. Compiled from research on 2026-10-08 (sources in docs/research/).
#
# Each event has:
#   first_reports: what the originating source itself published — what this system sees
#                  first, BEFORE anyone writes "stocks plunge after…". Catching these is the goal.
#                  approx: true marks titles reconstructed from coverage (the original wording
#                  could not be verified).
#   coverage:      later wire/news headlines describing the move (verbatim from coverage).
# noise: headlines that sound important but moved nothing — they must NOT be texted.
#
# Headline fields: text, tier (primary|wire|media|social), entities (who the source speaks for).

