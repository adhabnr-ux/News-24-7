# Whole-text urgency markers (wires and bulletin feeds use them for real breaking news).
urgency: ['^breaking\b', '^just in\b', '^flash\b', '^alert\b', '^\*', '^urgent\b', '\bbreaking:']

# Themes: a theme fires when EVERY group in `all` has at least one hit. Matching runs over
# the item text plus the names of entities found in it (so an OpenAI blog post titled
# "Introducing X" still counts as an OpenAI announcement).
themes:
  ai_lab_launch:
    description: A frontier AI lab launched something
    all:
      - [openai, anthropic, google deepmind, deepmind, gemini, xai, grok, meta ai, mistral, deepseek, perplexity, qwen, moonshot ai, kimi]
      - [launch*, introduc*, unveil*, releas*, available today, now available, announc*, rolling out, debut*, preview]
    weight: 15
    direction: mixed
  ai_disrupts_software:
    description: AI product aimed at a software / services category ("SaaSpocalypse" risk)
    all:
      - [openai, anthropic, claude, chatgpt, google deepmind, gemini, xai, grok, meta ai, perplexity, mistral, deepseek]
      - [launch*, introduc*, unveil*, releas*, available today, now available, rolling out, announc*, debut*, leak*, touts, reveals, how *, plugins for, preview]
      - [agent*, plugin*, plug-ins, cowork, enterprise, coding, legal, law, financ*, accounting, tax, crm, sales, marketing, customer service, customer support, design, spreadsheet*, excel, presentation*, security, cybersecurity, cyber*, vulnerabilit*, browser, workspace, office, hr, recruiting, analytics, data, education, tutoring, translation, search, shopping, ads, advertising, video, healthcare, cobol, mainframe, modernize, contract*, compliance, insurance, wealth, game*, gaming, world model, interactive worlds, it services, consulting]
    weight: 20
    direction: down
    tickers: [CRM, NOW, ADBE, INTU, WDAY, TEAM, HUBS, MNDY, DOCU, TRI, RELX, IT, DUOL, CHGG, IGV]
  ai_disrupts_search:
    description: AI search / browser / shopping launch that threatens Google's core business
    all:
      - [openai, chatgpt, anthropic, perplexity, xai, grok, meta ai, apple, safari, ai]
      - [search, searches, browser, ads, advertising, shopping, checkout]
      - [launch*, introduc*, unveil*, releas*, rolling out, announc*, available, declin*, drop*, fall*, first time, turn to, shift*]
    weight: 15
    direction: down
    tickers: [GOOGL]
  ai_lab_financials:
    description: AI-lab money news (revenue, valuation, funding, spending) — re-prices the whole AI trade
    all:
      - [openai, anthropic, xai, mistral, perplexity, chatgpt, sam altman, stargate, safe superintelligence, thinking machines]
      - [revenue, run-rate, run rate, annualized, valuation, funding, raises, raising, ipo, losses, loss, burn, cash burn, investors, investor presentation, profit, profitable, targets, forecast*, projections, spending, compute commitment*, scale back, scales back, cuts, delays, bankrupt*, debt, bond*, financing, cost*, invest*, stall*, halts, pulls back]
    weight: 28
    direction: mixed
    tickers: [NVDA, ORCL, CRWV, AMD, AVGO, MSFT, SMCI, NBIS, SMH]
  ai_compute_deal:
    description: Giant AI compute / data-center deal (usually bullish for infra names)
    all:
      - [data center*, data centre*, datacenter*, gigawatt*, compute, gpus, accelerators, chips, capex, capital expenditure*, stargate, supercomputer, ai infrastructure, cloud contract, cloud deal, remaining performance obligations]
      - [deal, agreement, partnership, partners with, collaboration, invest*, billion, trillion, contract, commit*, build*, order*, sign*, deploy*]
    weight: 15
    direction: up
    tickers: [NVDA, AMD, AVGO, ORCL, MU, TSM, VRT, ANET, CRWV, CEG, SMH]
  frontier_model_release:
    description: New frontier AI model (in 2026 even "routine" Claude/GPT releases hit software stocks)
    all:
      - [claude, gpt-*, gpt, gemini, grok, llama, deepseek, qwen, mythos, sonnet, opus, o3, o4, o5]
      - [introduc*, launch*, releas*, unveil*, announc*, debut*, available, leak*, preview]
    weight: 12
    direction: down
    tickers: [IGV, CRM, NOW, ADBE, INTU]
  fed_independence:
    description: The President attacks or moves against the Fed chair (dollar, gold, long yields react first)
    all:
      - [trump, president, white house, realdonaldtrump, doj, justice department]
      - [powell, fed chair, federal reserve, the fed, mr. too late, interest rates, fed governor]
      - [fire, firing, fired, remove*, loser, too late, subpoena*, grand jury, investigation, indict*, lower, cut rates, now]
    weight: 20
    direction: down
    tickers: [SPY, TLT, GLD]
  ai_tool_disrupts_industry:
    description: Any AI app/agent aimed at a fee- or seat-based industry (insurance brokers, wealth managers, legal...)
