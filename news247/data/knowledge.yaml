# Built-in market knowledge used by the scorer and the price monitor.
#
# Extend it from config.yaml (scoring.companies / scoring.keywords / scoring.themes,
# market.groups) rather than editing this file, so upgrades don't clobber your changes.
#
# Matching rules
#   aliases : case-insensitive, whole-word ("nvidia" matches "Nvidia's", not "nvidiaX")
#   cased   : case-sensitive, whole-word (for names that are also common words: "Meta", "Apple")
#   exposure: tickers that usually move when a *private* company makes news
#   '*'     : in keywords/theme terms, matches any word ending ("acqui*" -> acquire, acquisition)

default_watchlist: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, TSLA, AVGO, AMD, ORCL, CRM, NOW, ADBE, PLTR, QQQ, SPY]

