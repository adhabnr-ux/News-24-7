# Price-move baskets ("groups"): a group alert fires when the group's average move
# over `window` seconds reaches `pct` and at least `min_members` members moved >= pct/2
# in the same direction. This is the "all the stocks are crashing" detector.
baskets:
  software:
    symbols: [CRM, NOW, ADBE, INTU, WDAY, TEAM, HUBS, DDOG, SNOW, MDB, PANW, CRWD, DOCU, MNDY, IGV]
    pct: 2.0
    window: 600
    min_members: 5
  semis:
    symbols: [NVDA, AMD, AVGO, TSM, MU, INTC, QCOM, ARM, ASML, MRVL, SMH]
    pct: 2.0
