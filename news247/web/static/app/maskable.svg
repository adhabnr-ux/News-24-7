<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs>
    <radialGradient id="bg" cx="28%" cy="22%" r="95%">
      <stop offset="0" stop-color="#231833"/>
      <stop offset="0.55" stop-color="#110E18"/>
      <stop offset="1" stop-color="#08070B"/>
    </radialGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.45" stop-color="#FFB22E"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FF6FA0"/>
      <stop offset="1" stop-color="#FF2E74"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/><g transform="translate(51.2 51.2) scale(0.8)">
  
  
  <!-- faint tape track the glyph rides on -->
  <path d="M96 152 H 470" stroke="#FFB22E" stroke-opacity=".10" stroke-width="64" stroke-linecap="round"/>
  <!-- the F, cut from ticker tape -->
  <g fill="url(#tape)">
    <rect x="132" y="120" width="68" height="282" rx="34"/>
    <path d="M166 120 H 350 L 398 152 L 350 184 H 166 Z"/>
    <rect x="132" y="240" width="160" height="58" rx="29"/>
  </g>
  <!-- sprocket holes, like a ticker tape -->
  <g fill="#0E0B14">
    <circle cx="226" cy="152" r="9"/>
    <circle cx="266" cy="152" r="9"/>
    <circle cx="306" cy="152" r="9"/>
    <circle cx="166" cy="330" r="9"/>
    <circle cx="166" cy="366" r="9"/>
  </g>
  <!-- the signal, ahead of the tape -->
  <circle cx="446" cy="152" r="30" fill="#FF2E74" opacity=".55" filter="url(#glow)"/>
  <circle cx="446" cy="152" r="19" fill="url(#spark)"/>

</g></svg>