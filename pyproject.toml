[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news247"
version = "1.0.0"
description = "24/7 market-moving news monitor: catches announcements, filings, halts and price shocks within seconds and pushes them to your phone."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.9",
  "feedparser>=6.0",
  "PyYAML>=6.0",
  "tzdata>=2024.1",  # time-zone database for slim containers / Windows
  "cryptography>=41",  # Web Push encryption + VAPID signing (Foretape phone alerts)
  "pg8000>=1.31",  # pure-Python Postgres driver: optional STATE_DB keeps phone subscriptions durable
  "segno>=1.5",  # pure-Python QR codes (Setup page: scan to open Foretape / pair WhatsApp)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
# self-hosted WhatsApp sender: whatsmeow (Go) through its Python binding; Linux/macOS x86-64 and arm64
whatsapp = ["neonize>=0.5.2,<0.6"]

[project.scripts]
news247 = "news247.cli:main"

[tool.setuptools.packages.find]
include = ["news247*"]

[tool.setuptools.package-data]
news247 = ["web/static/*", "web/static/app/*", "data/*.yaml", "relay/*.sh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "B008", "B905"]
