# 100% free cloud deploy on Render (https://render.com): runs 24/7 on the Free plan.
# Alerts go to Foretape, News247's home-screen app with push notifications (docs/FORETAPE.md):
# open https://<app>.onrender.com/app/?token=<DASHBOARD_TOKEN> on your phone, Add to Home Screen,
# tap "Turn on alerts". Optionally also WhatsApp through Meta's free test number (docs/FREE-SETUP.md);
# leave the WhatsApp fields empty if you don't use it.
#   1. Click the "Deploy to Render" button in the README (or New > Blueprint > this repo).
#   2. Render asks for the values marked "sync: false" below (your number, e-mail and the IDs/
#      token from Meta's developer page). Everything else is generated or preset.
#   3. Open the dashboard URL + ?token=<DASHBOARD_TOKEN> (shown under Environment), go to Setup.
#
# Free plan notes: News247 pings itself every 10 minutes so Render never puts it to sleep (one
# service running all month uses ~744 of the 750 free hours). The disk is temporary: history
# resets when Render restarts the service, which doesn't matter for alerts.
services:
  - type: web
    name: news247
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WHATSAPP_TO
        sync: false          # YOUR WhatsApp number (where alerts go), e.g. +16235551234
      - key: CONTACT_EMAIL
        sync: false          # the SEC requires a contact e-mail in requests
      - key: WHATSAPP_CLOUD_ENABLED
        value: "true"
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false          # Meta: permanent System User access token
      - key: WHATSAPP_CLOUD_PHONE_ID
        sync: false          # Meta: WhatsApp > API Setup > "Phone number ID"
      - key: WHATSAPP_CLOUD_WABA_ID
        sync: false          # Meta: WhatsApp > API Setup > "WhatsApp Business Account ID"
      - key: WHATSAPP_CLOUD_APP_SECRET
        sync: false          # Meta: App settings > Basic > "App secret" (verifies your replies)
      - key: WHATSAPP_CLOUD_VERIFY_TOKEN
        generateValue: true  # pasted into Meta's webhook form (shown on the Setup page)
      - key: DASHBOARD_TOKEN
        generateValue: true  # protects the dashboard/setup page on the public URL
      - key: TIMEZONE
        value: America/New_York
      - key: STATE_DB
        sync: false          # optional: free Postgres URL (e.g. Neon) so phones stay subscribed across restarts
      - key: ALPACA_KEY
        sync: false          # optional: Alpaca API key (app.alpaca.markets, paper account is fine): options tape + news
      - key: ALPACA_SECRET
        sync: false          # optional: the matching Alpaca secret key
      # Optional free push backup: NTFY_ENABLED=true, NTFY_BACKUP=true, NTFY_TOPIC=<secret topic>.
