# One-click cloud deploy on Render (https://render.com): runs News247 24/7 and sends alerts to
# your WhatsApp from the server itself (a linked WhatsApp device, docs/WHATSAPP.md).
#   1. Click the "Deploy to Render" button in the README (or New > Blueprint > this repo).
#   2. Render asks for the values marked "sync: false" below: your WhatsApp number and e-mail.
#   3. Open the dashboard URL + ?token=<DASHBOARD_TOKEN> (shown under Environment), go to Setup,
#      link the sending WhatsApp account (QR or code), then press "Send test message".
services:
  - type: web
    name: news247
    runtime: docker
    plan: starter            # always on (~$7/month); the free plan sleeps and would miss news
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: WHATSAPP_TO
        sync: false          # YOUR WhatsApp number (where alerts go), e.g. +16235551234
      - key: CONTACT_EMAIL
        sync: false          # the SEC requires a contact e-mail in requests
      - key: DASHBOARD_TOKEN
        generateValue: true  # protects the dashboard/setup page (and WhatsApp pairing)
      - key: RELAY_SECRET
        generateValue: true  # only used if you also turn on the iMessage relay (RELAY_ENABLED=true)
      - key: TIMEZONE
        value: America/New_York
      # Optional free push backup: NTFY_ENABLED=true, NTFY_BACKUP=true, NTFY_TOPIC=<secret topic>.
      # Optional iMessage from your own Mac: RELAY_ENABLED=true, IMESSAGE_TO=<number>.
    disk:
      name: news247-data     # also keeps the WhatsApp pairing across restarts and deploys
      mountPath: /data/data
      sizeGB: 1
